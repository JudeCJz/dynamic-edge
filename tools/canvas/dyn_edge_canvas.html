<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dyn Edge Canvas</title>
<style>
:root{
  --bg:#26262A; --bg2:#2D2D32; --bg3:#38383F; --line:#3A3A41; --text:#ECECEF; --dim:#A0A0A8; --faint:#6E6E76;
  --acc:#FF6A55; --on-acc:#160A08;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 var(--font)}
body{display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header.bar{display:flex;align-items:center;gap:4px;padding:6px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:650;display:flex;align-items:center;gap:8px;margin-right:10px;letter-spacing:.01em;white-space:nowrap}
.brand svg{color:var(--acc)}
.tabs{display:flex;gap:2px;margin-right:auto}
.tab{background:none;border:0;padding:8px 10px;border-radius:8px;cursor:pointer;color:var(--dim);display:inline-flex;align-items:center;gap:6px;position:relative}
.tab:hover{color:var(--text);background:var(--bg2)}
.tab.on{color:var(--acc)}
.tab.on::after{content:"";position:absolute;left:10px;right:10px;bottom:2px;height:2px;border-radius:2px;background:var(--acc)}
.btn{background:transparent;border:0;padding:6px 8px;border-radius:8px;display:inline-flex;gap:6px;align-items:center;cursor:pointer;white-space:nowrap;color:var(--text)}
.btn:hover{background:var(--bg3)}
.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--acc);color:var(--on-acc);font-weight:600}
.btn.on{color:var(--acc)}
.btn.sm{padding:4px 6px}
.btn.danger:hover{color:#FF6B6B}
.ic{display:inline-flex;width:18px;height:18px;align-items:center;justify-content:center;flex:none}
.ic svg{width:18px;height:18px}
.noicons i[data-lucide]::before{content:attr(data-fb);font-style:normal;font-size:10px;font-weight:600;letter-spacing:.02em}
.noicons i[data-lucide]{width:auto;min-width:18px}
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.stagewrap{position:relative;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;width:100%;min-height:0;display:block;touch-action:none;cursor:crosshair}
.stagebar{display:flex;gap:6px;align-items:center;padding:6px 10px;border-top:1px solid var(--line);flex-wrap:wrap;min-height:44px}
.pages{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:thin}
.chip{background:var(--bg2);border:0;border-radius:999px;padding:4px 10px;cursor:pointer;white-space:nowrap;color:var(--dim)}
.chip.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.chip.off{opacity:.5}
.readout{margin-left:auto;color:var(--faint);font-variant-numeric:tabular-nums;font-size:12px;white-space:nowrap}
aside.panel{overflow:auto;border-left:1px solid var(--line);padding:4px 16px 60px;min-height:0}
.sec{padding:12px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin:0 0 8px;font-weight:600;display:flex;align-items:center;gap:6px;min-height:28px}
.sec h3 .sp{flex:1}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;align-items:center;min-height:34px}
.row>label{color:var(--dim);font-size:12px}
.rng{display:flex;align-items:center;gap:8px}
input[type=range]{flex:1;min-width:0;accent-color:var(--acc);height:24px}
input.num{width:64px;background:var(--bg3);border:0;border-radius:7px;padding:5px 6px;text-align:right;font-variant-numeric:tabular-nums}
input.txt,select,textarea{background:var(--bg3);border:0;border-radius:7px;padding:6px 8px;width:100%;min-width:0}
select{cursor:pointer}
textarea{font:12px/1.45 ui-monospace,Consolas,monospace;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.sw.on{border-color:var(--acc)}
.colors{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
input[type=color]{width:32px;height:26px;border:0;background:none;padding:0;cursor:pointer}
input[type=color].on{outline:2px solid var(--acc);border-radius:4px}
.switch{position:relative;width:40px;height:22px;flex:none}
.switch input{opacity:0;width:100%;height:100%;margin:0;position:absolute;cursor:pointer}
.switch span{position:absolute;inset:0;background:var(--bg3);border-radius:22px;transition:background .15s;pointer-events:none}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#C9C9CF;transition:transform .15s}
.switch input:checked+span{background:var(--acc)}
.switch input:checked+span::after{transform:translateX(18px);background:var(--on-acc)}
.seg{display:inline-flex;background:var(--bg2);border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{background:none;border:0;padding:5px 9px;border-radius:7px;cursor:pointer;color:var(--dim);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:600}
.li{display:flex;align-items:center;gap:6px;padding:3px 4px 3px 8px;border-radius:8px;cursor:pointer;min-height:36px}
.li:hover{background:var(--bg2)}
.li.sel{background:color-mix(in srgb,var(--acc) 16%,transparent)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .meta{color:var(--faint);font-size:11px;white-space:nowrap}
.li input.txt{background:transparent;padding:4px 2px}
.li input.txt:focus{background:var(--bg3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:4px}
.tool{background:none;border:0;border-radius:9px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.tool:hover{background:var(--bg2);color:var(--text)}
.tool.on{color:var(--acc)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:4px;border-radius:9px;cursor:pointer;color:var(--dim);font-size:11px}
.thumb canvas{border-radius:8px;display:block}
.thumb.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.hint{color:var(--faint);font-size:12px;margin:4px 0}
.info{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.warn{color:#FFB35C}
.menu{position:fixed;z-index:60;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:240px;max-height:80vh;overflow:auto;box-shadow:0 16px 40px rgba(0,0,0,.45)}
.menu .mh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);padding:8px 10px 4px}
.menu button{width:100%;justify-content:flex-start}
dialog{background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(760px,94vw)}
dialog::backdrop{background:rgba(10,10,12,.6)}
dialog h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;gap:8px}
dialog textarea{height:min(52vh,460px)}
.dlgbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;align-items:center}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--acc);color:var(--on-acc);padding:8px 14px;border-radius:999px;font-weight:600;z-index:80;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hide{display:none!important}
.stdot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.st-pending{background:#8E8E93}.st-approved{background:#30D158}.st-changes{background:#FFB35C}.st-rejected{background:#FF6B6B}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px 8px}
.gcell{background:none;border:0;padding:0;cursor:pointer;color:var(--dim);font-size:11px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.gcell canvas{width:100%;height:auto;border-radius:10px;display:block}
.gcell .cap{display:flex;align-items:center;gap:5px;padding:0 2px;min-width:0}
.gcell .cap span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcell.sel canvas{outline:2px solid var(--acc);outline-offset:1px}
.rv{padding:8px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .top{display:flex;align-items:center;gap:8px;min-width:0}
.rv canvas{border-radius:8px;flex:none}
.rv .nm{flex:1;min-width:0}
.rv .nm b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .nm small{color:var(--faint);font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv textarea{height:auto;min-height:34px;margin-top:6px;font:12px/1.4 var(--font)}
.seg.ico button{padding:5px 6px}
#home{flex:1;overflow:auto;padding:12px 16px 80px;min-height:0}
#home .hbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
#home .hbar h2{font-size:15px;margin:0 8px 0 0;font-weight:650}
.hgal{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:18px 14px}
.hcell{display:flex;flex-direction:column;gap:6px;min-width:0;position:relative}
.hcell canvas{width:100%;height:auto;border-radius:12px;display:block;cursor:pointer}
.hcell .t{display:flex;align-items:center;gap:6px;min-width:0}
.hcell .t input.txt{background:transparent;padding:3px 2px;font-weight:600}
.hcell .t input.txt:focus{background:var(--bg3)}
.hcell .a{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
.hcell .tag{font-size:11px;color:var(--faint);white-space:nowrap}
.hcell.dragging{opacity:.35}
.hcell.drop canvas{outline:2px dashed var(--acc);outline-offset:2px}
.grip{cursor:grab;touch-action:none}
body.home main{display:none}
body:not(.home) #home{display:none}
@media (max-width:860px){
  html,body{height:auto}
  body{overflow:auto;display:block}
  main{display:block}
  .stagewrap{position:sticky;top:0;z-index:5;background:var(--bg);height:50vh;border-bottom:1px solid var(--line)}
  aside.panel{border-left:0;overflow:visible;padding:4px 16px 80px}
  .tab .lb,.btn .lb{display:none}
  .brand .lb{display:none}
  .row{grid-template-columns:96px minmax(0,1fr)}
  .readout{display:none}
  .hgal{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 10px}
  #home{padding:10px 12px 80px}
  .rv .top{flex-wrap:wrap}
}
</style>
</head>
<body class="icons-pending">
<header class="bar">
  <div class="brand"><i class="ic" data-lucide="radius" data-fb="DE"></i><span class="lb">Dyn Edge Canvas</span></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="btn" id="bTemplates" title="Templates"><i class="ic" data-lucide="layout-template" data-fb="Tpl"></i><span class="lb">Templates</span></button>
  <button class="btn" id="bUndo" title="Undo (Ctrl+Z)"><i class="ic" data-lucide="undo-2" data-fb="Undo"></i></button>
  <button class="btn" id="bRedo" title="Redo (Ctrl+Y)"><i class="ic" data-lucide="redo-2" data-fb="Redo"></i></button>
  <button class="btn" id="bImport" title="Import JSON"><i class="ic" data-lucide="upload" data-fb="In"></i><span class="lb">Import</span></button>
  <button class="btn" id="bExport" title="Export JSON"><i class="ic" data-lucide="download" data-fb="Out"></i><span class="lb">Export</span></button>
  <button class="btn" id="bPng" title="Export PNG of the stage"><i class="ic" data-lucide="image" data-fb="PNG"></i><span class="lb">PNG</span></button>
  <label class="btn" title="Interface accent colour"><i class="ic" data-lucide="palette" data-fb="UI"></i><input type="color" id="uiAccent" value="#FF6A55"></label>
</header>
<main>
  <section class="stagewrap">
    <canvas id="stage" aria-label="Stage: phone corner with the edge"></canvas>
    <div class="stagebar" id="stagebar"></div>
  </section>
  <aside class="panel" id="panel"></aside>
</main>
<section id="home" aria-label="Windows home"></section>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <div class="dlgbar" id="dlgBar"></div>
  <div class="hint" id="dlgMsg"></div>
</dialog>
<input type="file" id="fileIn" accept=".json,application/json" class="hide">
<input type="file" id="imgIn" accept="image/*" class="hide">
<div class="toast" id="toast"></div>
<script>
'use strict';
/* =====================================================================================
   Dyn Edge Canvas - design tool for the Dynamic Edge corner widget.
   Coordinates: dp, origin = the screen's bottom-right corner, the shape lies toward -x / -y.
   Polar angle: degrees, 0 = along the bottom edge, 90 = along the right edge (same as Win.kt / Looks.kt).
   ===================================================================================== */

const D = Math.PI / 180;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeIO = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const uid = p => (p || 'e') + '_' + Math.random().toString(36).slice(2, 8);
const $ = s => document.querySelector(s);
const clone = o => JSON.parse(JSON.stringify(o));

/* Colours used by the overlay (EdgeView constants). */
const C = { FILL: '#1C1C1E', TRACK: '#2C2C2E', GREY: '#8E8E93', GREEN: '#30D158', DECLINE: '#FF453A', WARM: '#2E1B1A' };
const FONT = 'Roboto,"Segoe UI",system-ui,sans-serif';
const WT = { normal: 400, medium: 500, bold: 700 };

function hex2rgb(h) {
  h = String(h || '#000').replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  const n = parseInt(h.slice(0, 6), 16) || 0;
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgb2hex(c) { return '#' + c.map(v => Math.round(clamp(v, 0, 255)).toString(16).padStart(2, '0')).join('').toUpperCase(); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); t = clamp(t, 0, 1); return rgb2hex([0, 1, 2].map(i => A[i] + (B[i] - A[i]) * t)); }
function rgba(hex, a) { const c = hex2rgb(hex); return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + clamp(a, 0, 1) + ')'; }
function lum(hex) { const c = hex2rgb(hex); return (0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]) / 255; }

/* =====================================================================================
   Spring (port of Spring.kt: unit mass, closed-form under / critical / over damped)
   ===================================================================================== */
class Spring {
  constructor(v, k, z) { this.value = v; this.target = v; this.velocity = 0; this.stiffness = k; this.damping = z; }
  snap(v) { this.value = this.target = v; this.velocity = 0; }
  settled(pe, ve) { return Math.abs(this.value - this.target) < pe && Math.abs(this.velocity) < ve; }
  step(t) {
    if (t <= 0) return;
    const w = Math.sqrt(Math.max(this.stiffness, 1e-6)), z = Math.max(this.damping, 0);
    const x0 = this.value - this.target, v0 = this.velocity;
    let x, v;
    if (z < 0.999) {
      const a = z * w, wd = w * Math.sqrt(1 - z * z), b = (v0 + a * x0) / wd, e = Math.exp(-a * t), c = Math.cos(wd * t), s = Math.sin(wd * t);
      x = e * (x0 * c + b * s); v = e * ((-a * x0 + b * wd) * c + (-a * b - x0 * wd) * s);
    } else if (z <= 1.001) {
      const b = v0 + w * x0, e = Math.exp(-w * t);
      x = (x0 + b * t) * e; v = (b - w * (x0 + b * t)) * e;
    } else {
      const sq = Math.sqrt(z * z - 1), r1 = -w * (z - sq), r2 = -w * (z + sq), c2 = (v0 - r1 * x0) / (r2 - r1), c1 = x0 - c2, e1 = Math.exp(r1 * t), e2 = Math.exp(r2 * t);
      x = c1 * e1 + c2 * e2; v = c1 * r1 * e1 + c2 * r2 * e2;
    }
    this.value = this.target + x; this.velocity = v;
  }
}

/* Synthetic music signal (port of DemoBeat in EdgePreviewView.kt, ~118 BPM). */
class DemoBeat {
  constructor() { this.levels = [0, 0, 0, 0]; this.bass = 0; this.energy = 0; this.t = 0; this.since = 0; }
  step(dt) {
    const P = 60 / 118; this.t += dt; this.since += dt; if (this.since >= P) this.since -= P;
    const env = Math.exp(-this.since * 7), off = (this.since + P * .5) % P, env2 = Math.exp(-off * 10), t = this.t, L = this.levels;
    L[0] = clamp(.12 + .82 * env + .05 * Math.sin(t * 3.1), 0, 1);
    L[1] = clamp(.18 + .5 * env + .22 * Math.abs(Math.sin(t * 5.3)), 0, 1);
    L[2] = clamp(.14 + .4 * env2 + .25 * Math.abs(Math.sin(t * 7.7 + 1)), 0, 1);
    L[3] = clamp(.1 + .55 * env2 + .15 * Math.abs(Math.sin(t * 11.3)), 0, 1);
    this.bass = env; this.energy = Math.min(.65 * env + .25 * env2, 1);
  }
}

/* =====================================================================================
   Icons: Lucide from unpkg (pinned). Canvas icons are built from the Lucide icon nodes as
   Path2D and stroked (24 viewport, stroke 2, round caps / joins). Offline: a small built-in
   set in the same stroke style, the UI falls back to short text labels.
   ===================================================================================== */
const LUCIDE_URL = 'https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js';
const FALLBACK = {
  'circle-dot': [['circle', { cx: 12, cy: 12, r: 10 }], ['circle', { cx: 12, cy: 12, r: 1 }]],
  'play': [['polygon', { points: '6 3 20 12 6 21 6 3' }]],
  'pause': [['rect', { x: 14, y: 4, width: 4, height: 16, rx: 1 }], ['rect', { x: 6, y: 4, width: 4, height: 16, rx: 1 }]],
  'skip-forward': [['polygon', { points: '5 4 15 12 5 20 5 4' }], ['line', { x1: 19, x2: 19, y1: 5, y2: 19 }]],
  'skip-back': [['polygon', { points: '19 20 9 12 19 4 19 20' }], ['line', { x1: 5, x2: 5, y1: 19, y2: 5 }]],
  'timer': [['line', { x1: 10, x2: 14, y1: 2, y2: 2 }], ['line', { x1: 12, x2: 15, y1: 14, y2: 11 }], ['circle', { cx: 12, cy: 14, r: 8 }]],
  'music': [['path', { d: 'M9 18V5l12-2v13' }], ['circle', { cx: 6, cy: 18, r: 3 }], ['circle', { cx: 18, cy: 16, r: 3 }]],
  'bell': [['path', { d: 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9' }], ['path', { d: 'M10.3 21a1.94 1.94 0 0 0 3.4 0' }]],
  'phone': [['path', { d: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z' }]],
  'phone-off': [['path', { d: 'M10.7 13.3a16 16 0 0 0 3.4 2.6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-3.3-2.7M4.2 13.2A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8' }], ['line', { x1: 22, x2: 2, y1: 2, y2: 22 }]],
  'download': [['path', { d: 'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4' }], ['polyline', { points: '7 10 12 15 17 10' }], ['line', { x1: 12, x2: 12, y1: 15, y2: 3 }]],
  'battery-charging': [['path', { d: 'M15 7h1a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-2' }], ['path', { d: 'M6 7H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h1' }], ['path', { d: 'm11 7-3 5h4l-3 5' }], ['line', { x1: 22, x2: 22, y1: 11, y2: 13 }]],
  'alarm-clock': [['circle', { cx: 12, cy: 13, r: 8 }], ['path', { d: 'M12 9v4l2 2' }], ['path', { d: 'M5 3 2 6' }], ['path', { d: 'm22 6-3-3' }]],

      iconBtn('trash-2', 'Delete event', e => { e.stopPropagation(); pushUndo(); doc.events.splice(i, 1); S.evt = clamp(S.evt, 0, doc.events.length - 1); stopEvent(); renderPanel(); changed(); }, 'danger')));
  });
  p.append(ls);
  const E = curEvt();
  if (!E) { p.append(h('div', { class: 'hint' }, 'No events. Add one above or load one from Templates.')); return; }
  const pl = sec('Preview');
  const playB = h('button', { class: 'btn pri', id: 'evPlay', onclick: () => { st.ev.playing ? stopEvent() : startEvent(); renderStagebar(); } });
  pl.append(h('div', { class: 'rng' }, playB, fToggle('Loop', () => S.evLoop, v => { S.evLoop = v; })));
  pl.append(fRange('Timeline (paused)', () => S.evScrub, v => { S.evScrub = v; if (st.ev.playing) stopEvent(); }, 0, 1, .01));
  p.append(pl); renderPanelLight();

  const b = sec('Event');
  b.append(fText('Name', () => E.name, v => { E.name = v; }));
  b.append(fSelect('Kind', () => E.kind, v => {
    const old = KINDS[E.kind], k = KINDS[v]; E.kind = v;
    if (old && E.glyph.icon === old.icon) E.glyph.icon = k.icon;
    if (old && E.ring.mode === old.ring) Object.assign(E.ring, { mode: k.ring, from: k.from, to: k.to });
    E.actions = k.actions ? k.actions.slice() : [];
  }, Object.keys(KINDS).map(k => [k, KINDS[k].label]), renderPanel));
  b.append(fRange('Bean size x idle', () => E.scale, v => { E.scale = v; }, 1, 2.6, .05));
  b.append(h('div', { class: 'info' }, 'Live size ' + (L().idleDp * E.scale).toFixed(1) + ' dp (the app uses LIVE_SCALE 1.55).'));
  b.append(fColor('Colour', () => E.color, v => { E.color = v; }, [['accent', 'Accent'], ['white', 'White'], ['#30D158', 'Green', () => C.GREEN], ['#FF9F0A', 'Orange', () => '#FF9F0A'], ['#0A84FF', 'Blue', () => '#0A84FF']]));
  b.append(fRange('Duration ms', () => E.durationMs, v => { E.durationMs = v; }, 500, 30000, 100));
  b.append(fToggle('Pulse while held', () => E.pulse, v => { E.pulse = v; }));
  b.append(fRange('Glow', () => E.glow, v => { E.glow = v; }, 0, 1, .01));
  p.append(b);

  const gl = sec('Glyph');
  gl.append(fSeg('Type', () => E.glyph.type, v => { E.glyph.type = v; if (v === 'art' && !E.glyph.art) E.glyph.art = (doc.idleArts[0] || {}).id || null; }, [['none', 'None'], ['icon', 'Icon'], ['art', 'Idle art'], ['viz', 'Visualizer']], renderPanel));
  if (E.glyph.type === 'icon') gl.append(fIcon('Icon', () => E.glyph.icon, v => { E.glyph.icon = v; }));
  if (E.glyph.type === 'art') gl.append(fSelect('Art', () => E.glyph.art || '', v => { E.glyph.art = v; }, doc.idleArts.map(a => [a.id, a.name])));
  if (E.glyph.type === 'viz') gl.append(fSelect('Preset', () => E.glyph.viz, v => { E.glyph.viz = v; }, PRESETS.map(x => [x, x])));
  p.append(gl);

  const tx = sec('Text along the rim');
  tx.append(fText('Text', () => E.text.value, v => { E.text.value = v; }, '{remaining} {elapsed} {pct}'));
  tx.append(fSeg('Place', () => E.text.place, v => { E.text.place = v; }, [['rim', 'Rim'], ['none', 'Hidden']]));
  tx.append(fRange('Size sp', () => E.text.sizeSp, v => { E.text.sizeSp = v; }, 6, 16, .5));
  tx.append(h('div', { class: 'info' }, 'Tokens: {remaining} and {elapsed} (m:ss of the duration), {pct} (ring value x 100).'));
  p.append(tx);

  const rg = sec('Ring');
  rg.append(fSelect('Mode', () => E.ring.mode, v => { E.ring.mode = v; }, [['none', 'None'], ['countdown', 'Countdown'], ['progress', 'Progress'], ['indeterminate', 'Indeterminate']]));
  rg.append(fRange('From', () => E.ring.from, v => { E.ring.from = v; }, 0, 1, .01));
  rg.append(fRange('To', () => E.ring.to, v => { E.ring.to = v; }, 0, 1, .01));
  rg.append(fToggle('Answer / decline', () => E.actions.length > 0, v => { E.actions = v ? ['answer', 'decline'] : []; }));
  p.append(rg);

  ['in', 'out'].forEach(k => {
    const m = E[k], s = sec(k === 'in' ? 'Motion in' : 'Motion out');
    s.append(fSeg('Type', () => m.motion, v => {
      m.motion = v;
      if (v === 'pop') { m.stiffness = 700; m.damping = .45; }
      if (v === 'spring') { m.stiffness = k === 'in' ? 420 : 520; m.damping = k === 'in' ? .74 : .92; }
    }, [['spring', 'Spring'], ['pop', 'Pop'], ['ease', 'Ease'], ['fade', 'Fade']], renderPanel));
    if (m.motion === 'spring' || m.motion === 'pop') {
      s.append(fRange('Stiffness', () => m.stiffness, v => { m.stiffness = v; }, 40, 1500, 5));
      s.append(fRange('Damping', () => m.damping, v => { m.damping = v; }, .2, 1.2, .01));
    } else s.append(fRange('Time ms', () => m.ms, v => { m.ms = v; }, 40, 2000, 10));
    p.append(s);
  });
}

/* =====================================================================================
   Templates menu, import / export, PNG
   ===================================================================================== */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openTemplates(anchor) {
  if (menuEl) return closeMenu();
  const item = (icon, label, fn) => h('button', { class: 'btn', onclick: () => { closeMenu(); fn(); } }, ic(icon, ''), label);
  const addArt = a => { pushUndo(); doc.idleArts.push(a); doc.idleActive = a.id; S.frame = 0; S.tab = 'idle'; S.presetPreview = null; setMode('idle'); renderAll(); changed(); };
  const addEvt = e => { pushUndo(); doc.events.push(e); S.evt = doc.events.length - 1; S.tab = 'events'; setMode('event'); stopEvent(); renderAll(); changed(); };
  menuEl = h('div', { class: 'menu', role: 'menu' },
    h('div', { class: 'mh' }, 'Windows'),
    item('timer', 'Focus (pomodoro)', () => addWindow(tplFocus())),
    item('cloud-sun', 'Weather', () => addWindow(tplWeather())),
    item('music', 'Now playing (big art)', () => addWindow(tplNowPlaying())),
    h('div', { class: 'mh' }, 'Idle arts'),
    item('grid-3x3', 'Pulse rings (8 frames)', () => addArt(tplPulseRings())),
    item('grid-3x3', 'Equalizer (6 frames)', () => addArt(tplEqualizer())),
    h('div', { class: 'mh' }, 'Events'),
    item('timer', 'Timer countdown', () => addEvt(tplTimerEvent())),
    item('music', 'Music playing', () => addEvt(tplMusicEvent())),
    item('battery-charging', 'Charging', () => addEvt(tplChargingEvent())),
    h('div', { class: 'mh' }, 'Review catalogue'),
    item('list-plus', 'Add missing catalogue items', () => { pushUndo(); const n = addMissingCatalogue(); afterDocSwap(); toast(n ? 'Added ' + n + ' items' : 'Nothing missing'); }),
    h('div', { class: 'mh' }, 'Document'),
    item('rotate-ccw', 'Reset to the full example', () => { pushUndo(); doc = defaultDoc(); S.win = 0; S.evt = 0; S.sel = null; S.frame = 0; afterDocSwap(); toast('Example loaded (Undo restores)'); }),
  );
  document.body.appendChild(menuEl);
  const r = anchor.getBoundingClientRect();
  menuEl.style.top = (r.bottom + 6) + 'px';
  menuEl.style.left = clamp(r.left, 8, window.innerWidth - menuEl.offsetWidth - 8) + 'px';
  refreshIcons();
}
document.addEventListener('pointerdown', e => { if (menuEl && !menuEl.contains(e.target) && !e.target.closest('#bTemplates')) closeMenu(); });

function openDialog(kind, mode) {
  const dlg = $('#dlg'), ta = $('#dlgText'), bar = $('#dlgBar'), msg = $('#dlgMsg');
  bar.textContent = ''; msg.textContent = '';
  const title = $('#dlgTitle'); title.textContent = '';
  if (kind === 'export') {
    title.append(ic('download', ''), 'Export JSON');
    let sub = mode === 'import';
    const fill = () => {
      const d = sub ? exportSubset() : exportFull();
      ta.value = JSON.stringify(d, null, 2); ta.readOnly = true;
      msg.textContent = sub ? 'For import: ' + d.themes.length + ' themes and ' + d.windows.length + ' windows marked Approved or Changes (notes included). Schema dyn-edge-canvas v2.'
        : 'Full document: everything with statuses and notes. Schema dyn-edge-canvas v2 (v1 files still import). See .agents/skills/dyn-edge-canvas/SKILL.md.';
      [...modeSeg.children].forEach((b2, k) => b2.classList.toggle('on', (k === 1) === sub));
    };
    const modeSeg = h('div', { class: 'seg' }, h('button', { onclick: () => { sub = false; fill(); } }, 'Full document'), h('button', { onclick: () => { sub = true; fill(); } }, 'For import (Approved + Changes)'));
    bar.append(modeSeg,
      btn('download', 'Download .json', () => download(new Blob([ta.value], { type: 'application/json' }), sub ? 'dyn-edge-approved.json' : 'dyn-edge-design.json'), { cls: 'pri' }),
      btn('copy', 'Copy', async () => { try { await navigator.clipboard.writeText(ta.value); msg.textContent = 'Copied.'; } catch (e) { ta.select(); msg.textContent = 'Select all and copy (clipboard blocked).'; } }),
      btn('x', 'Close', () => dlg.close()));
    fill();
  } else {
    title.append(ic('upload', ''), 'Import JSON');
    ta.value = ''; ta.readOnly = false; ta.placeholder = 'Paste an exported design here, or load a file.';
    const doImport = merge => {
      let d;
      try { d = normalize(JSON.parse(ta.value)); } catch (e) { msg.textContent = 'Not a valid design: ' + e.message; return; }
      pushUndo();
      if (merge) {
        const map = {};
        d.idleArts.forEach(a => { const nid = doc.idleArts.some(x => x.id === a.id) ? uid('art') : a.id; map[a.id] = nid; a.id = nid; doc.idleArts.push(a); });
        d.windows.forEach(w => { w.id = uid('win'); if (w.idle.art && map[w.idle.art]) w.idle.art = map[w.idle.art]; doc.windows.push(w); });
        d.themes.forEach(t => { t.id = uid('thm'); if (map[t.idle.art]) t.idle.art = map[t.idle.art]; doc.themes.push(t); });
        d.events.forEach(e => { e.id = uid('evt'); if (e.glyph && e.glyph.art && map[e.glyph.art]) e.glyph.art = map[e.glyph.art]; doc.events.push(e); });
      } else { doc = d; S.win = 0; S.evt = 0; S.frame = 0; }
      S.sel = null; afterDocSwap(); dlg.close(); toast(merge ? 'Merged (Undo reverts)' : 'Imported (Undo reverts)');
    };
    bar.append(
      btn('folder-open', 'Load file', () => $('#fileIn').click()),
      btn('check', 'Replace document', () => doImport(false), { cls: 'pri' }),
      btn('plus', 'Merge (append themes, windows, arts, events)', () => doImport(true)),
      btn('x', 'Close', () => dlg.close()));
  }
  dlg.showModal(); refreshIcons();
}
$('#fileIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader(); rd.onload = () => { $('#dlgText').value = String(rd.result); $('#dlgMsg').textContent = 'Loaded ' + f.name + '. Choose Replace or Merge.'; };
  rd.readAsText(f); e.target.value = '';
});
$('#imgIn').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f || !imgTarget) return;
  const t = imgTarget, rd = new FileReader();
  rd.onload = () => {
    const im = new Image();
    im.onload = () => { // downscale to 256 px so the JSON stays small
      const k = Math.min(1, 256 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      pushUndo(); t.src = c.toDataURL('image/jpeg', .85); changed();
    };
    im.src = String(rd.result);
  };
  rd.readAsDataURL(f); e.target.value = '';
});
function exportPng() {
  draw(ctx, true);
  try { cv.toBlob(b => { if (b) download(b, 'dyn-edge-' + S.mode + '.png'); else toast('PNG export failed'); }, 'image/png'); }
  catch (e) { toast('PNG export blocked: ' + e.message); }
}

/* =====================================================================================
   Boot
   ===================================================================================== */
function applyUiAccent(c) {
  S.uiAccent = c;
  document.documentElement.style.setProperty('--acc', c);
  document.documentElement.style.setProperty('--on-acc', lum(c) > .55 ? '#121214' : '#FFFFFF');
  $('#uiAccent').value = c;
}
$('#uiAccent').addEventListener('input', e => { applyUiAccent(e.target.value.toUpperCase()); changed(); });
$('#bTemplates').addEventListener('click', e => openTemplates(e.currentTarget));
$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bImport').addEventListener('click', () => openDialog('import'));
$('#bExport').addEventListener('click', () => openDialog('export'));
$('#bPng').addEventListener('click', exportPng);
document.body.appendChild(h('datalist', { id: 'iconlist' }, Object.keys(FALLBACK).map(k => h('option', { value: k }))));
new ResizeObserver(resize).observe(cv);
window.addEventListener('resize', resize);

applyUiAccent(S.uiAccent || '#FF6A55');
S.win = clamp(S.win, 0, Math.max(0, doc.windows.length - 1));
S.evt = clamp(S.evt, 0, Math.max(0, doc.events.length - 1));
// the page always opens on the Windows home
S.tab = 'home';
if (!themeById(S.theme)) S.theme = doc.themes.length ? doc.themes[0].id : null;
if (!GROUPS.some(g => g[0] === S.wgroup)) S.wgroup = 'all';
ensureDeck();
document.body.classList.toggle('home', true);
RS = activeStyle();
st.pagePos = deckPos(S.win);
st.open = S.mode === 'open';
setOpen(st.open); syncSizes(true);
resize();
st.zc = NaN;
renderAll(); updUndo();
loadLucide();
requestAnimationFrame(frame);
window.addEventListener('beforeunload', save);
window.__dyn = { get doc() { return doc; }, S, st, normalize, shapePath, draw: () => draw(ctx, false) };
